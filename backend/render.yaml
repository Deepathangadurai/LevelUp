services:
  - type: web
    name: levelup-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Paste your Neon/Supabase Postgres connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false